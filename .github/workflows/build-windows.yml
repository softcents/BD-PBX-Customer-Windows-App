name: Build BD PBX Windows

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  PJSIP_VERSION: 2.15.1

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare PJSIP 2.15.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $parent = Split-Path $workspace -Parent
          $zip = Join-Path $parent 'pjproject.zip'
          $pj = Join-Path $parent 'pjproject'
          $url = "https://github.com/pjsip/pjproject/archive/refs/tags/$env:PJSIP_VERSION.zip"

          Write-Host "Downloading PJSIP $env:PJSIP_VERSION..."
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          if (Test-Path $pj) { Remove-Item $pj -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $parent -Force
          $extracted = Join-Path $parent "pjproject-$env:PJSIP_VERSION"
          Rename-Item $extracted $pj

          $config = Join-Path $pj 'pjlib\include\pj\config_site.h'
          @"
          #ifndef __PJ_CONFIG_SITE_H__
          #define __PJ_CONFIG_SITE_H__
          #define PJ_CONFIG_MICROSIP 1
          #define PJMEDIA_HAS_VIDEO 0
          #define PJMEDIA_HAS_OPUS 1
          #define PJMEDIA_HAS_SRTP 1
          #define PJMEDIA_HAS_TLS 1
          #endif
          "@ | Set-Content -Path $config -Encoding ASCII

          Write-Host 'PJSIP source prepared.'

      - name: Build PJSIP
        shell: cmd
        working-directory: ..\pjproject
        run: msbuild pjproject-vs14.sln /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143

      - name: Install PJSIP headers and libraries for BD PBX
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $parent = Split-Path $workspace -Parent
          $pj = Join-Path $parent 'pjproject'

          $dirs = @('pjlib','pjlib-util','pjnath','pjmedia','pjsip','third_party')
          foreach ($d in $dirs) {
            $src = Join-Path $pj $d
            $dst = Join-Path $parent $d
            if (-not (Test-Path $src)) { throw "Missing PJSIP directory: $src" }
            if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
            Copy-Item $src $dst -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path (Join-Path $parent 'lib') | Out-Null
          Get-ChildItem -Path (Join-Path $pj 'lib') -Filter '*.lib' -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName (Join-Path $parent 'lib') -Force }

          Get-ChildItem -Path (Join-Path $pj 'third_party') -Filter '*.lib' -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName (Join-Path $parent 'lib') -Force }

          Write-Host 'PJSIP headers and libraries installed.'
          Get-ChildItem (Join-Path $parent 'lib') -Filter '*.lib' | Select-Object -ExpandProperty Name

      - name: Build Opus library
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $opusRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'opus-build'
          if (Test-Path $opusRoot) { Remove-Item $opusRoot -Recurse -Force }
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git $opusRoot
          $build = Join-Path $opusRoot 'build'
          cmake -S $opusRoot -B $build -G "Visual Studio 17 2022" -A Win32 -DBUILD_SHARED_LIBS=OFF -DOPUS_BUILD_PROGRAMS=OFF -DOPUS_BUILD_TESTING=OFF
          cmake --build $build --config Release
          $opusLib = Get-ChildItem -Path $build -Filter 'opus.lib' -Recurse | Select-Object -First 1
          if (-not $opusLib) { throw 'opus.lib was not produced.' }
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'lib') | Out-Null
          Copy-Item $opusLib.FullName (Join-Path $env:GITHUB_WORKSPACE 'lib\opus.lib') -Force
          Write-Host "Installed $($opusLib.FullName) as lib\opus.lib"

      - name: Build BD PBX
        shell: cmd
        run: msbuild microsip.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0

      - name: Find EXE
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path . -Filter microsip.exe -Recurse | Where-Object { $_.FullName -notmatch '\\microsip\\' } | Select-Object -First 1
          if (-not $exe) { throw 'No microsip.exe was produced.' }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $exe.FullName 'artifacts/BD-PBX.exe'

      - name: Upload BD PBX EXE
        uses: actions/upload-artifact@v4
        with:
          name: BD-PBX-Windows
          path: artifacts/BD-PBX.exe
