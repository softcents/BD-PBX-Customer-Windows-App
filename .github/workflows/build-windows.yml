name: Build BD PBX Windows
# Rebuild after account UI update

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  PJSIP_VERSION: 2.15.1

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare PJSIP 2.15.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $parent = Split-Path $workspace -Parent
          $zip = Join-Path $parent 'pjproject.zip'
          $pj = Join-Path $parent 'pjproject'
          $url = "https://github.com/pjsip/pjproject/archive/refs/tags/$env:PJSIP_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          if (Test-Path $pj) { Remove-Item $pj -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $parent -Force
          $extracted = Join-Path $parent "pjproject-$env:PJSIP_VERSION"
          Rename-Item $extracted $pj
          $config = Join-Path $pj 'pjlib\include\pj\config_site.h'
          @"
          #ifndef __PJ_CONFIG_SITE_H__
          #define __PJ_CONFIG_SITE_H__
          #define PJ_CONFIG_MICROSIP 1
          #define PJMEDIA_HAS_VIDEO 1
          #define PJMEDIA_HAS_OPUS 1
          #define PJMEDIA_HAS_SRTP 1
          #define PJMEDIA_HAS_TLS 1
          #endif
          "@ | Set-Content -Path $config -Encoding ASCII
          Get-ChildItem -Path $pj -Filter '*.vcxproj' -Recurse | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            $text = $text -replace '<RuntimeLibrary>MultiThreaded</RuntimeLibrary>', '<RuntimeLibrary>MultiThreadedDLL</RuntimeLibrary>'
            $text = $text -replace '<RuntimeLibrary>MultiThreadedDebug</RuntimeLibrary>', '<RuntimeLibrary>MultiThreadedDebugDLL</RuntimeLibrary>'
            Set-Content -Path $_.FullName -Value $text -Encoding UTF8
          }

      - name: Build PJSIP
        shell: cmd
        working-directory: ..\pjproject
        run: msbuild pjproject-vs14.sln /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:RuntimeLibrary=MultiThreadedDLL

      - name: Install PJSIP headers and libraries for BD PBX
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $parent = Split-Path $workspace -Parent
          $pj = Join-Path $parent 'pjproject'
          $dirs = @('pjlib','pjlib-util','pjnath','pjmedia','pjsip','third_party')
          foreach ($d in $dirs) {
            $src = Join-Path $pj $d
            $dst = Join-Path $parent $d
            if (-not (Test-Path $src)) { throw "Missing PJSIP directory: $src" }
            if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
            Copy-Item $src $dst -Recurse -Force
          }
          $libDir = Join-Path $parent 'lib'
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          Get-ChildItem -Path (Join-Path $pj 'lib') -Filter '*.lib' -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName $libDir -Force }
          Get-ChildItem -Path (Join-Path $pj 'third_party') -Filter '*.lib' -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName $libDir -Force }
          $pjCombined = Join-Path $pj 'lib\libpjproject-i386-Win32-vc14-Release.lib'
          $pjExpected = Join-Path $libDir 'libpjproject-i386-Win32-vc14-Release-Static.lib'
          if (-not (Test-Path $pjCombined)) { throw "Missing PJSIP combined library: $pjCombined" }
          Copy-Item $pjCombined $pjExpected -Force

      - name: Build Opus library
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          $opusRoot = Join-Path $parent 'opus-build'
          if (Test-Path $opusRoot) { Remove-Item $opusRoot -Recurse -Force }
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git $opusRoot
          $build = Join-Path $opusRoot 'build'
          cmake -S $opusRoot -B $build -G "Visual Studio 17 2022" -A Win32 -DBUILD_SHARED_LIBS=OFF -DOPUS_BUILD_PROGRAMS=OFF -DOPUS_BUILD_TESTING=OFF -DOPUS_STATIC_RUNTIME=OFF
          cmake --build $build --config Release
          $opusLib = Get-ChildItem -Path $build -Filter 'opus.lib' -Recurse | Select-Object -First 1
          if (-not $opusLib) { throw 'opus.lib was not produced.' }
          $libDir = Join-Path $parent 'lib'
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          Copy-Item $opusLib.FullName (Join-Path $libDir 'opus.lib') -Force

      - name: Verify build inputs and branding
        shell: powershell
        run: |
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          $libDir = Join-Path $parent 'lib'
          foreach ($file in @((Join-Path $libDir 'opus.lib'),(Join-Path $libDir 'libpjproject-i386-Win32-vc14-Release-Static.lib'))) {
            if (-not (Test-Path $file)) { throw "Missing required library: $file" }
          }
          $icon = Join-Path $env:GITHUB_WORKSPACE 'branding\BD-PBX.ico'
          if (-not (Test-Path $icon)) { throw 'Missing BD PBX branding icon.' }

      - name: Apply BD PBX fixed-domain UI/source patch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'tools\patch-bdpbx-domain.ps1')

      - name: Disable BD PBX update checker and force website links
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'tools\patch-bdpbx-updates.ps1')

      - name: Align BD PBX runtime with PJSIP and MFC
        shell: powershell
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'microsip.vcxproj'
          $text = Get-Content $project -Raw
          $text = $text -replace '<RuntimeLibrary>MultiThreaded</RuntimeLibrary>', '<RuntimeLibrary>MultiThreadedDLL</RuntimeLibrary>'
          $text = $text -replace '<RuntimeLibrary>MultiThreadedDebug</RuntimeLibrary>', '<RuntimeLibrary>MultiThreadedDebugDLL</RuntimeLibrary>'
          $text = $text -replace '<UseOfMfc>Static</UseOfMfc>', '<UseOfMfc>Dynamic</UseOfMfc>'
          $text = $text -replace '<PreprocessorDefinitions>WIN32;_WINDOWS;NDEBUG;%(PreprocessorDefinitions)</PreprocessorDefinitions>', '<PreprocessorDefinitions>WIN32;_WINDOWS;NDEBUG;_AFXDLL;%(PreprocessorDefinitions)</PreprocessorDefinitions>'
          Set-Content -Path $project -Value $text -Encoding UTF8

      - name: Build BD PBX
        shell: cmd
        run: msbuild microsip.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:RuntimeLibrary=MultiThreadedDLL

      - name: Prepare EXE and VC++ runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path . -Filter microsip.exe -Recurse | Where-Object { $_.FullName -notmatch '\\microsip\\' } | Select-Object -First 1
          if (-not $exe) { throw 'No microsip.exe was produced.' }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $exe.FullName 'artifacts/BD-PBX.exe' -Force
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x86.exe' -OutFile 'artifacts/vc_redist.x86.exe' -UseBasicParsing

      - name: Prepare default BD PBX sounds
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          function Write-ToneWav {
            param(
              [string]$Path,
              [double[]]$Frequencies,
              [double]$ToneDuration = 0.25,
              [double]$GapDuration = 0.10,
              [int]$Repeats = 1,
              [double]$Volume = 0.42
            )
            $sampleRate = 8000
            $channels = 1
            $bits = 16
            $segments = @()
            for ($r = 0; $r -lt $Repeats; $r++) {
              foreach ($frequency in $Frequencies) {
                $segments += @{ Frequency = $frequency; Duration = $ToneDuration }
                $segments += @{ Frequency = 0; Duration = $GapDuration }
              }
            }
            $sampleCount = 0
            foreach ($segment in $segments) {
              $sampleCount += [int]($segment.Duration * $sampleRate)
            }
            $dataBytes = $sampleCount * 2
            $fs = New-Object System.IO.FileStream($Path, [System.IO.FileMode]::Create)
            $bw = New-Object System.IO.BinaryWriter($fs)
            try {
              $bw.Write([System.Text.Encoding]::ASCII.GetBytes('RIFF'))
              $bw.Write([int](36 + $dataBytes))
              $bw.Write([System.Text.Encoding]::ASCII.GetBytes('WAVE'))
              $bw.Write([System.Text.Encoding]::ASCII.GetBytes('fmt '))
              $bw.Write([int]16)
              $bw.Write([Int16]1)
              $bw.Write([Int16]$channels)
              $bw.Write([int]$sampleRate)
              $bw.Write([int]($sampleRate * $channels * ($bits / 8)))
              $bw.Write([Int16]($channels * ($bits / 8)))
              $bw.Write([Int16]$bits)
              $bw.Write([System.Text.Encoding]::ASCII.GetBytes('data'))
              $bw.Write([int]$dataBytes)

              $sampleIndex = 0
              foreach ($segment in $segments) {
                $count = [int]($segment.Duration * $sampleRate)
                for ($i = 0; $i -lt $count; $i++) {
                  $sample = 0.0
                  if ($segment.Frequency -gt 0) {
                    $t = $i / [double]$sampleRate
                    $fade = [Math]::Min(1.0, [Math]::Min($t / 0.015, (($count / [double]$sampleRate) - $t) / 0.015))
                    if ($fade -lt 0) { $fade = 0 }
                    $sample = $Volume * $fade * [Math]::Sin(2 * [Math]::PI * $segment.Frequency * ($sampleIndex / [double]$sampleRate))
                  }
                  $bw.Write([Int16]([Math]::Round($sample * 32767)))
                  $sampleIndex++
                }
              }
            } finally {
              $bw.Dispose()
              $fs.Dispose()
            }
          }

          Write-ToneWav (Join-Path $out 'ringtone.wav') @([double]440,[double]554) 0.55 0.12 2 0.45
          Write-ToneWav (Join-Path $out 'ringing2.wav') @([double]660,[double]880) 0.14 0.10 1 0.40
          Write-ToneWav (Join-Path $out 'ringing.wav') @([double]523,[double]659) 0.22 0.08 1 0.40
          Write-ToneWav (Join-Path $out 'msgin.wav') @([double]784,[double]988) 0.10 0.08 1 0.38
          Write-ToneWav (Join-Path $out 'msgout.wav') @([double]988,[double]784) 0.10 0.08 1 0.38
          Write-ToneWav (Join-Path $out 'hangup.wav') @([double]523,[double]392) 0.16 0.08 1 0.38

          Get-ChildItem $out -Filter '*.wav' | ForEach-Object {
            if ($_.Length -lt 1000) { throw "Invalid sound file: $($_.FullName)" }
          }

      - name: Prepare BD PBX installer branding
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $exePath = (Resolve-Path 'artifacts\BD-PBX.exe').Path
          $icoPath = Join-Path (Resolve-Path 'artifacts').Path 'BD-PBX-installer.ico'
          $bmpPath = Join-Path (Resolve-Path 'artifacts').Path 'BD-PBX-wizard.bmp'
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exePath)
          if (-not $icon) { throw 'Could not extract the BD PBX icon from the EXE.' }
          try {
            $stream = [System.IO.File]::Open($icoPath, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write)
            try { $icon.Save($stream) } finally { $stream.Dispose() }
            $bmp = New-Object System.Drawing.Bitmap 164,314
            try {
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              try {
                $g.Clear([System.Drawing.Color]::White)
                $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
                $size = 128
                $x = [int](($bmp.Width - $size) / 2)
                $y = 48
                $g.DrawIcon($icon, $x, $y)
                $font = New-Object System.Drawing.Font('Segoe UI', 16, [System.Drawing.FontStyle]::Bold)
                try {
                  $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(40,40,40))
                  try {
                    $text = 'BD PBX'
                    $textSize = $g.MeasureString($text, $font)
                    $g.DrawString($text, $font, $brush, ($bmp.Width-$textSize.Width)/2, 210)
                  } finally { $brush.Dispose() }
                } finally { $font.Dispose() }
              } finally { $g.Dispose() }
              $bmp.Save($bmpPath, [System.Drawing.Imaging.ImageFormat]::Bmp)
            } finally { $bmp.Dispose() }
          } finally { $icon.Dispose() }
          if (-not (Test-Path $icoPath)) { throw 'Installer icon was not created.' }
          if (-not (Test-Path $bmpPath)) { throw 'Installer wizard branding image was not created.' }

      - name: Build BD PBX installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc 'installer\BD-PBX.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'artifacts\BD-PBX-Setup.exe')) { throw 'Installer was not produced.' }

      - name: Upload BD PBX EXE
        uses: actions/upload-artifact@v4
        with:
          name: BD-PBX-Windows
          path: artifacts/BD-PBX.exe

      - name: Upload BD PBX Installer
        uses: actions/upload-artifact@v4
        with:
          name: BD-PBX-Installer
          path: artifacts/BD-PBX-Setup.exe