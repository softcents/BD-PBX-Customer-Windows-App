name: Build BD PBX Windows

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build BD PBX
        shell: cmd
        run: msbuild *.vcxproj /m /p:Configuration=Release /p:Platform=x64

      - name: Find EXE
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path . -Filter *.exe -Recurse | Where-Object { $_.FullName -notmatch '\\packages\\|\\third_party\\' } | Select-Object -First 1
          if (-not $exe) { throw 'No EXE was produced.' }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $exe.FullName 'artifacts/BD-PBX.exe'

      - name: Upload BD PBX EXE
        uses: actions/upload-artifact@v4
        with:
          name: BD-PBX-Windows
          path: artifacts/BD-PBX.exe
